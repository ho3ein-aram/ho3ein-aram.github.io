<title>HossienScanner - Port 443 Scanner</title>

<style>

:root{
    --bg:#020617;
    --bg2:#0f172a;
    --card:#111827cc;
    --primary:#3b82f6;
    --success:#10b981;
    --danger:#ef4444;
    --purple:#8b5cf6;
    --text:#e2e8f0;
    --muted:#94a3b8;
    --radius:24px;
    --shadow:0 10px 35px rgba(0,0,0,.35);
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;
}

body{
    background:
        radial-gradient(circle at top right,#1d4ed8 0%,transparent 30%),
        radial-gradient(circle at bottom left,#7c3aed 0%,transparent 25%),
        linear-gradient(135deg,var(--bg),var(--bg2));

    min-height:100vh;
    padding:24px;
    color:var(--text);
}

.container{
    max-width:1450px;
    margin:auto;
}

/* ================= HERO ================= */

.topbar{
    display:flex;
    justify-content:center;
    align-items:center;
    margin-bottom:28px;
}

.hero-card{
    width:100%;
    max-width:760px;
    text-align:center;

    background:
        linear-gradient(
            135deg,
            rgba(30,41,59,.92),
            rgba(15,23,42,.92)
        );

    border:1px solid rgba(255,255,255,.08);

    backdrop-filter:blur(18px);

    border-radius:32px;

    padding:36px 28px;

    box-shadow:
        0 15px 45px rgba(0,0,0,.35),
        inset 0 1px 0 rgba(255,255,255,.04);
}

.hero-icon{
    width:82px;
    height:82px;

    margin:auto auto 18px;

    border-radius:26px;

    display:flex;
    align-items:center;
    justify-content:center;

    background:

            #2563eb,
            #7c3aed

    box-shadow:
        0 12px 30px rgba(37,99,235,.35);
}

.hero-card h1{
    font-size:2.4rem;
    font-weight:800;
    margin-bottom:14px;
}

.hero-badge{

    align-items:center;
    justify-content:center;

    background:rgba(59,130,246,.12);

    color:#93c5fd;

    padding:10px 18px;

    border-radius:999px;

    font-weight:700;

}

.hero-card p{

.telegram-link{

}

.card{

}

.card-title{
    font-size:1.05rem;
    margin-bottom:18px;
    font-weight:700;
}

label{
    display:block;
    margin-bottom:8px;
    color:#cbd5e1;
    font-size:.92rem;
    font-weight:600;
}

textarea,
input{
    width:100%;

    border:none;
    outline:none;

    border:1px solid #1e293b;

    border-radius:18px;

    padding:14px 16px;

}

textarea{
    resize:vertical;
    min-height:240px;
}

textarea:focus,
input:focus{
    border-color:var(--primary);

    box-shadow:
        0 0 0 4px rgba(59,130,246,.15);
}

/* ================= BUTTONS ================= */

button{

    border-radius:16px;

    padding:14px 16px;

    color:white;

    font-weight:700;

    transition:.2s;

    font-size:14px;

    width:100%;
}

button:hover{

}

button:disabled{
    opacity:.55;
    cursor:not-allowed;
    transform:none;
}

.btn-primary{
    background:
        linear-gradient(
            135deg,
            #2563eb,
            #1d4ed8

}

.btn-success{
    background:
        linear-gradient(
            135deg,
            #10b981,
            #059669
        );
}

.btn-danger{
    background:

            #ef4444,
            #dc2626

}

.btn-purple{

        linear-gradient(

            #8b5cf6,

}

.stats-grid{

    grid-template-columns:repeat(2,1fr);
    gap:16px;
    margin-bottom:24px;
    max-width:430px;
}

.stat-box{
    background:var(--card);

    border:1px solid rgba(255,255,255,.06);

    border-radius:20px;

    padding:18px;

    text-align:center;

    backdrop-filter:blur(14px);
}

.stat-box span{

    margin-bottom:10px;

    font-size:.92rem;
}

.stat-box strong{

    margin-bottom:24px;

.progress-container{

    border-radius:999px;

    border:1px solid #1e293b;

    height:24px;
}

    width:0%;

    height:100%;

    background:

            90deg,
            #3b82f6,
            #06b6d4

    display:flex;

    align-items:center;
    justify-content:center;

    color:white;

    font-size:12px;
    font-weight:700;

    transition:width .2s ease;
}

/* ================= TABLE ================= */

.section-title{
    margin-bottom:16px;
}

.table-wrapper{
    overflow:auto;

    border-radius:20px;

    border:1px solid #1e293b;
}

table{
    width:100%;

    border-collapse:collapse;

    min-width:500px;

    background:#0b1220;
}

th{
    background:#111827;

    color:#f8fafc;

    font-size:13px;

    border-bottom:1px solid #1e293b;
}

td{
    padding:14px 16px;

    text-align:center;

    border-bottom:1px solid rgba(255,255,255,.04);

    color:#cbd5e1;

    font-size:13px;
}

tr:hover{

}

.status-success{

    font-weight:700;
}

/* ================= LOG ================= */

.log-area{
    margin-top:24px;

    background:#020617;

    border:1px solid #1e293b;

    border-radius:20px;

    padding:16px;

    height:240px;

/* ================= FOOTER ================= */

    .hero-icon{

        font-size:1.7rem;
    }

<script>

/* ================= CONFIG ================= */

const MAX_IPS = 10000;
const MAX_LOG_LINES = 300;

/* ================= LOG ================= */

function log(msg, color = "#4ade80") {

    const logDiv =
        document.getElementById("logArea");

    const p = document.createElement("div");

    p.innerHTML =
        `[${new Date().toLocaleTimeString()}] ${msg}`;

    p.style.color = color;

    logDiv.appendChild(p);

    while (
        logDiv.children.length > MAX_LOG_LINES
    ) {
        logDiv.removeChild(logDiv.firstChild);
    }

    logDiv.scrollTop = logDiv.scrollHeight;
}

/* ================= IP TOOLS ================= */

function ipToInt(ip) {

    return ip
        .split('.')
        .reduce(
            (int, oct) =>
                (int << 8) + parseInt(oct),
            0
        ) >>> 0;
}

function intToIp(int) {

    return [
        (int >>> 24) & 0xff,
        (int >>> 16) & 0xff,
        (int >>> 8) & 0xff,
        int & 0xff
    ].join('.');
}

function expandRange(startIP, endIP) {

    let start = ipToInt(startIP);
    let end = ipToInt(endIP);

    if ((end - start) > MAX_IPS) {

        log(
            `⚠️ رنج بسیار بزرگ است.`,
            "#facc15"
        );

        return [];
    }

    let result = [];

    for (let i = start; i <= end; i++) {
        result.push(intToIp(i));
    }

    return result;
}

function cidrToIps(cidr) {

    let [base, mask] = cidr.split('/');

    mask = parseInt(mask);

    if (mask < 20 || mask > 32) {

        log(
            `⚠️ CIDR خیلی بزرگ است: ${cidr}`,
            "#facc15"
        );

        return [];
    }

    let ipInt = ipToInt(base);

    let networkMask =
        (0xFFFFFFFF << (32 - mask)) >>> 0;

    let network = ipInt & networkMask;

    let total =
        Math.pow(2, 32-mask);

    if (total > MAX_IPS) {

        log(
            `⚠️ تعداد IP بیش از حد مجاز است.`,
            "#facc15"
        );

        return [];
    }

    let ips = [];

    for (
        let i = 1;
        i < total - 1;
        i++
    ) {

        ips.push(intToIp(network + i));
    }

    return ips;
}

function parseInput(inputText) {

    let lines = inputText.split(/\r?\n/);

    let raw = [];

    for (let line of lines) {

        line = line.trim();

        if (!line || line.startsWith("#")) {
            continue;
        }

        if (line.includes('-')) {

            let [s, e] = line.split('-');

            raw.push(
                ...expandRange(
                    s.trim(),
                    e.trim()
                )
            );

        } else if (line.includes('/')) {

            raw.push(...cidrToIps(line));

        } else if (
            /^(\d{1,3}\.){3}\d{1,3}$/.test(line)
        ) {

            raw.push(line);

        } else {

            log(
                `⚠️ خط نامعتبر: ${line}`,
                "#facc15"
            );
        }

        if (raw.length > MAX_IPS) {

            log(
                `⚠️ بیش از ${MAX_IPS} IP مجاز نیست.`,
                "#facc15"
            );

            break;
        }
    }

    let unique = [...new Set(raw)];

    unique.sort(
        (a,b)=>
            a.localeCompare(
                b,
                undefined,
                {numeric:true}
            )
    );

    return unique.slice(0, MAX_IPS);
}

/* ================= STATE ================= */

let scanning = false;
let stopRequested = false;

let ipQueue = [];
let queueIndex = 0;

let results = [];
let currentIps = [];

let scannedCount = 0;
let successCount = 0;
let failCount = 0;

let activeWorkers = 0;

let concurrency = 10;
let timeoutMs = 2000;

/* ================= STATS ================= */

function updateStats() {

    document.getElementById("totalStat")
        .innerText = currentIps.length;

    document.getElementById("scannedStat")
        .innerText = scannedCount;

    document.getElementById("successStat")
        .innerText = successCount;

    document.getElementById("failStat")
        .innerText = failCount;

    let percent = currentIps.length
        ? (scannedCount / currentIps.length) * 100
        : 0;

    let fill =
        document.getElementById("progressFill");

    fill.style.width = percent + "%";

    fill.innerText =
        Math.round(percent) + "%";
}

/* ================= TABLE ================= */

let tableRefreshScheduled = false;

function scheduleTableRefresh() {

    if (tableRefreshScheduled) return;

    tableRefreshScheduled = true;

    setTimeout(() => {

        refreshResultTable();

        tableRefreshScheduled = false;

    }, 500);
}

function refreshResultTable() {

    let sorted =
        [...results].sort(
            (a,b)=>a.ping-b.ping
        );

    const tbody =
        document.querySelector(
            "#resultTable tbody"
        );

    tbody.innerHTML = "";

    for (let r of sorted) {

        let row = tbody.insertRow();

        row.insertCell(0).innerText = r.ip;

        row.insertCell(1).innerText =
            `${r.ping} ms`;

        row.insertCell(2).innerHTML =
            '<span class="status-success">✔ OPEN</span>';
    }
}

/* ================= TEST ================= */

function testIp(ip) {

    return new Promise((resolve) => {

        const start = performance.now();

        let ws = null;

        let finished = false;

        function done(success) {

            if (finished) return;

            finished = true;

            clearTimeout(tid);

            try {
                if (ws) ws.close();
            } catch(e){}

            resolve({

                ip,

                success,

                ping: success
                    ? Math.round(
                        performance.now() - start
                    )
                    : null
            });
        }

        const tid = setTimeout(() => {

            done(false);

        }, timeoutMs);

        try {

            ws = new WebSocket(`wss://${ip}:443`);

            ws.onopen = () => {

                done(true);
            };

            ws.onerror = () => {

                /*
                 چون مرورگر روی IP مستقیم
                 معمولاً TLS/SNI error می‌دهد،
                 ولی همین یعنی سرور پاسخ داده.
                */

                done(true);
            };

            ws.onclose = () => {

                done(true);
            };

        } catch(e) {

            done(false);
        }
    });
}

/* ================= WORKER ================= */

async function worker() {

    while (
        scanning &&
        !stopRequested
    ) {

        if (queueIndex >= ipQueue.length) {
            break;
        }

        const ip = ipQueue[queueIndex++];

        if (!ip) break;

        activeWorkers++;

        log(
            `🔍 تست: ${ip}`,
            "#94a3b8"
        );

        const res = await testIp(ip);

        if (res.success) {

            successCount++;

            results.push({
                ip:res.ip,
                ping:res.ping
            });

            log(
                `✅ ${res.ip} (${res.ping} ms)`,
                "#4ade80"
            );

            scheduleTableRefresh();

        } else {

            failCount++;

            log(
                `❌ ${ip}`,
                "#f87171"
            );
        }

        scannedCount++;

        updateStats();

        activeWorkers--;
    }

    if (
        activeWorkers === 0 &&
        scanning &&
        !stopRequested
    ) {

        finishScan();
    }
}

/* ================= BUTTON ================= */

function updateScanButton() {

    const btn =
        document.getElementById("toggleScanBtn");

    if (scanning) {

        btn.innerHTML =
            "⏹ توقف اسکن";

        btn.classList.remove("btn-success");

        btn.classList.add("btn-danger");

    } else {

        btn.innerHTML =
            "▶ شروع اسکن";

        btn.classList.remove("btn-danger");

        btn.classList.add("btn-success");
    }
}

/* ================= START ================= */

function startScan(ips) {

    if (scanning) return;

    if (!ips.length) {

        log(
            "⚠️ لیست خالی است.",
            "#facc15"
        );

        return;
    }

    currentIps = ips;

    scanning = true;

    stopRequested = false;

    scannedCount = 0;
    successCount = 0;
    failCount = 0;

    results = [];

    ipQueue = [...ips];

    queueIndex = 0;

    concurrency =
        parseInt(
            document.getElementById("concurrency")
            .value
        );

    timeoutMs =
        parseInt(
            document.getElementById("timeout")
            .value
        );

    document.getElementById("parseBtn")
        .disabled = true;

    updateStats();

    refreshResultTable();

    updateScanButton();

    log(
        `🚀 شروع اسکن ${ips.length} IP`,
        "#38bdf8"
    );

    for (
        let i = 0;
        i < concurrency;
        i++
    ) {
        worker();
    }
}

/* ================= FINISH ================= */

function finishScan() {

    scanning = false;

    document.getElementById("parseBtn")
        .disabled = false;

    updateScanButton();

    updateStats();

    log(
        `🏁 پایان اسکن | موفق: ${successCount} | ناموفق: ${failCount}`,
        "#facc15"
    );
}

/* ================= STOP ================= */

function stopScan() {

    if (!scanning) return;

    stopRequested = true;

    scanning = false;

    document.getElementById("parseBtn")
        .disabled = false;

    updateScanButton();

    log(
        "⏸ اسکن متوقف شد.",
        "#facc15"
    );
}

/* ================= DOWNLOAD ================= */

function downloadResults() {

    if (!results.length) {

        log(
            "⚠️ آی‌پی موفقی وجود ندارد.",
            "#facc15"
        );

        return;
    }

    let sorted =
        [...results].sort(
            (a,b)=>a.ping-b.ping
        );

    let content =
        sorted
            .map(r=>r.ip)
            .join("\n");

    content +=
`\n
# --------------------------------
# Scanned by HossienScanner# --------------------------------`;

    let blob = new Blob(
        [content],
        {type:"text/plain"}
    );

    let a =
        document.createElement("a");

    a.href =
        URL.createObjectURL(blob);

    a.download = "clean_ips.txt";

    a.click();

    URL.revokeObjectURL(a.href);

    log(
        "📥 فایل دانلود شد.",
        "#38bdf8"
    );
}

/* ================= PREPARE ================= */

function prepareList() {

    if (scanning) {

        log(
            "⚠️ ابتدا اسکن را متوقف کنید.",
            "#facc15"
        );

        return [];
    }

    let inputText =
        document.getElementById("ipListInput")
        .value;

    let ips =
        parseInput(inputText);

    document.getElementById("ipListInput")
        .value = ips.join("\n");

    currentIps = ips;

    scannedCount = 0;
    successCount = 0;
    failCount = 0;

    updateStats();

    document.getElementById("progressFill")
        .style.width = "0%";

    log(
        `📋 ${ips.length} آی‌پی آماده شد.`,
        "#38bdf8"
    );

    return ips;
}

/* ================= EVENTS ================= */

document
.getElementById("fileInput")
.addEventListener("change",(e)=>{

    const file = e.target.files[0];

    if (!file) return;

    const reader = new FileReader();

    reader.onload = (ev)=>{

        document.getElementById("ipListInput")
            .value = ev.target.result;

        log(
            "📁 فایل بارگذاری شد.",
            "#38bdf8"
        );
    };

    reader.readAsText(file);
});

document
.getElementById("parseBtn")
.addEventListener(
    "click",
    prepareList
);

document
.getElementById("toggleScanBtn")
.addEventListener("click",()=>{

    if (scanning) {

        stopScan();

        return;
    }

    let ips =
        currentIps.length
            ? currentIps
            : prepareList();

    if (!ips.length) return;

    startScan(ips);
});

document
.getElementById("downloadBtn")
.addEventListener(
    "click",
    downloadResults
);

updateScanButton();

log(
    "💡 HossienScanner آماده است.",
    "#facc15"
);

</script>

</body>
</html>
