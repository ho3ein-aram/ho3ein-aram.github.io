<!doctype html>
<html lang="fa" dir="rtl" data-theme="dark">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#08090b">
<title>دانلود اپ</title>
<style>
:root{--bg:#08090b;--panel:#101216;--line:#ffffff12;--text:#f2f4f7;--muted:#9298a3}
html[data-theme="light"]{--bg:#eef0f3;--panel:#fff;--line:#11182718;--text:#17191d;--muted:#68707b}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 0,#181b21 0,#0b0c0f 34%,var(--bg) 70%);color:var(--text);font-family:Vazirmatn,Inter,sans-serif}
html[data-theme="light"] body{background:radial-gradient(circle at 50% 0,#dfe3e8 0,#f1f2f4 34%,var(--bg) 70%)}
.wrap{width:min(760px,100%);margin:auto;padding:18px 18px 40px}
.head{display:flex;align-items:center;gap:12px;padding:8px 0 22px}
.back{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--panel);color:var(--text);font-size:26px;cursor:pointer}
h1{font-size:25px;margin:0}.sub{font-size:11px;color:var(--muted);margin-top:4px}
.card{display:flex;align-items:center;gap:14px;padding:15px;margin:10px 0;border:1px solid var(--line);border-radius:20px;background:var(--panel);box-shadow:0 16px 50px #0004}
.icon{width:48px;height:48px;border-radius:12px;display:block;object-fit:contain;border:0;background:transparent;flex:none;box-shadow:none}
.info{flex:1;min-width:0}.info b{display:block;font-size:14px}.info small{display:block;color:var(--muted);font-size:10px;margin-top:4px}
.go{border:1px solid var(--line);background:var(--text);color:var(--bg);border-radius:12px;padding:10px 13px;text-decoration:none;font:700 10px Vazirmatn,Inter,sans-serif;white-space:nowrap}
.note{margin-top:18px;text-align:center;color:var(--muted);font-size:10px;line-height:1.8}
</style>
</head>
<body>
<div class="wrap">
  <div class="head"><button class="back" onclick="history.back()" aria-label="Back">‹</button><div><h1 id="title">دانلود اپ</h1><div class="sub" id="sub">نسخه‌های رسمی و جدید</div></div></div>
  <a class="card" href="https://github.com/termux/termux-app/releases" target="_blank" rel="noopener"><img class="icon" src="python-icon.png" alt="Termux"><span class="info"><b>Termux</b><small id="termuxSub">Android Terminal</small></span><span class="go">↗</span></a>
  <a class="card" href="https://www.python.org/downloads/" target="_blank" rel="noopener"><img class="icon" src="termux-icon.png" alt="Python 3"><span class="info"><b>Python 3</b><small id="pythonSub">Official Download</small></span><span class="go">↗</span></a>
  <div class="note" id="note">برای امنیت و به‌روزبودن، لینک‌ها به منابع رسمی پروژه‌ها می‌روند.</div>
</div>
<script>
try{const s=JSON.parse(localStorage.getItem('hossein_site_settings')||'null');document.documentElement.dataset.theme=(s&&s.theme)||'dark';document.documentElement.lang=(s&&s.language)||'fa';document.documentElement.dir=(s&&s.language)==='en'?'ltr':'rtl';
if((s&&s.language)==='en'){
 document.getElementById('title').textContent='App Downloads';document.getElementById('sub').textContent='Official and current releases';
 document.getElementById('termuxSub').textContent='Android Terminal';document.getElementById('pythonSub').textContent='Official Download';
 document.getElementById('note').textContent='For freshness and safety, links point to official project sources.';
}}catch(e){}
</script>
</body></html>
