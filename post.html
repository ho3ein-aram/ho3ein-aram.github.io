<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Post</title><style>body{margin:0;background:#f5f3ee;color:#151515;font-family:Tahoma,Arial}.wrap{max-width:820px;margin:auto;padding:35px 20px}a{color:inherit}.card{background:#fffdf8;border:1px solid #d9d5cc;border-radius:15px;padding:28px}h1{font-size:42px}.muted{color:#777;line-height:2}.comment{border-top:1px solid #ddd;padding:15px 0}textarea,input{width:100%;box-sizing:border-box;padding:12px;border:1px solid #ccc;border-radius:8px;margin:6px 0}button{padding:11px 16px;border:1px solid #111;border-radius:8px;background:#111;color:white}</style></head><body><main class="wrap"><a href="index.html">← برگشت</a><article id="post" class="card"></article><section class="card" style="margin-top:20px"><h2>نظرات</h2><div id="comments"></div><input id="name" placeholder="نام"><textarea id="body" placeholder="نظر شما..."></textarea><button onclick="addComment()">ارسال نظر</button></section></main><script>const id=Number(new URLSearchParams(location.search).get('id'));const posts=JSON.parse(localStorage.getItem('hossein_posts')||'[]');const p=posts.find(x=>x.id===id);document.getElementById('post').innerHTML=p?`<small>${p.date}</small><h1>${esc(p.title)}</h1><p class="muted">${esc(p.text)}</p><p>${p.tags.map(t=>'#'+esc(t)).join(' ')}</p>`:'<h1>پست پیدا نشد</h1>';function comments(){let c=JSON.parse(localStorage.getItem('comments_'+id)||'[]');document.getElementById('comments').innerHTML=c.length?c.map(x=>`<div class="comment"><b>${esc(x.name)}</b><div class="muted">${esc(x.body)}</div></div>`).join(''):'<p class="muted">هنوز نظری ثبت نشده.</p>'}function addComment(){let n=document.getElementById('name').value.trim(),b=document.getElementById('body').value.trim();if(!n||!b)return alert('نام و نظر را وارد کن');let c=JSON.parse(localStorage.getItem('comments_'+id)||'[]');c.push({name:n,body:b});localStorage.setItem('comments_'+id,JSON.stringify(c));document.getElementById('body').value='';comments()}function esc(s){return String(s).replace(/[&<>'"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[m]))}comments()</script><script>
document.addEventListener('DOMContentLoaded',function(){
  document.querySelectorAll('.menu-btn,.menu-button,.hamburger,.hamburger-btn,#menuBtn,#menu-button,#hamburger,#hamburgerBtn,.top-menu-btn,.header-menu-btn').forEach(function(el){
    el.classList.add('telegram-glass-menu');
  });
});
</script>
</body></html>
